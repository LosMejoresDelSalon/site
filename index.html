<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404Cap</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: #f4f4f4;
            color: #3f3f3f;
        }
        header {
            background-color: #e00202;
            color: white;
            padding: 1em 0;
            text-align: center;
        }
        nav ul {
            list-style: none;
            padding: 0;
            display: flex;
            justify-content: center;
        }
        nav ul li {
            margin: 0 15px;
        }
        nav ul li a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
        .container {
            width: 80%;
            margin: 20px auto;
            padding: 20px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .product-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            background-color: #fff;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }
        .product-card img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        .product-card h3 {
            margin: 10px 0;
            color: #555;
        }
        .product-card p {
            font-size: 1.1em;
            color: #007bff;
            font-weight: bold;
        }
        .product-card button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            margin-top: 10px;
        }
        .product-card button:hover {
            background-color: #0056b3;
        }
        footer {
            background-color: #e00202;
            color: white;
            text-align: center;
            padding: 1em 0;
            margin-top: 30px;
        }
        .buttonIA {
            align-items: center;
            background-color: #0063e4;
            color: white;
            padding: 18px 35px;
            border: none;
            border-radius: 10px;
            font-size: 22px;
            cursor: pointer;
            width: 100%;
            max-width: 1451px;
            transition: background-color 0.3s ease, transform 0.2s ease;
            font-weight: bold;
            text-align: center;
        }
        h1 {
            font-size: 70px;
        }
    </style>
</head>
<body>
    <header>
        <h1>404Cap</h1>
        <nav>
            <ul>

        </nav>

            <div class="product-card">

            </div>
            <div class="product-card">
                <img src="3.jpeg" alt="Sudadera con Capucha">
                <p>$1,200</p>
                <button>Añadir al Carrito</button>

            <div class="product-card">

            <div class="product-card">

            <div class="product-card">

</body>
</html>
